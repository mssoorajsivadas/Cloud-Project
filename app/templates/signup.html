<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Setup</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Manrope:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            background: var(--bg-app);
            font-family: var(--font-body);
            overflow: hidden;
            color: var(--text-primary);
        }

        .signup-section {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signup-card {
            width: min(100%, 550px);
            padding: 35px;
            background: var(--bg-widget);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
        }

        .glossy-typewriter-wrap {
            padding: 20px 0px;
        }

        .glossy-typewriter {
            font-size: 40px;
            cursor: pointer;
        }

        .signup-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .signup-header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .signup-header p {
            margin: 0;
            color: var(--text-secondary);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 18px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;

            border-radius: 10px;
            border: none;

            background: var(--bg-app);
            color: var(--text-secondary);

            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border: 1px solid var(--bg-action);
        }

        .form-group small {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .name-row {
            display: grid;
            grid-template-columns: 1fr 1fr;

            .signup-ad img {
                width: 50px;
                height: 50px;
            }

            gap: 12px;
        }

        .signup-button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 10px;

            background: var(--bg-action);
            color: var(--text-primary);

            font-size: 15px;
            cursor: pointer;
        }

        .signup-button:hover {
            opacity: 0.9;
        }

        .signin-link {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
        }

        .signin-link a {
            margin-left: 5px;
            color: var(--bg-action);
            font-weight: 600;
            text-decoration: none;
        }

        #form-message {
            display: none;

            padding: 10px 14px;
            margin-bottom: 15px;

            border-radius: 8px;

            font-size: 14px;

            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        #form-message.success {
            display: flex;
            background: var(--massage-success-bg);
            color: var(--massage-success-text);
        }


        #form-message.error {
            display: flex;
            background: var(--massage-error-bg);
            color: var(--massage-error-text);
        }

        #message-close {

            border: none;

            background: transparent;

            font-size: 20px;

            cursor: pointer;

            color: inherit;
        }

        .password-input {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-input input {
            padding-right: 60px;
        }

        .show-password {
            position: absolute;
            right: 10px;

            border: none;
            background: transparent;

            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
        }

    </style>
</head>

<body>
    <section class="signup-section">
        <div class="signup-card">

            <div class="glossy-typewriter-wrap">
                <a href="/">
                    <span class="glossy-typewriter" id="heroType" data-text=""
                        data-words='["Aerial Cloud", "welcoming you", "Aerial Cloud"]' data-type-speed="90"
                        data-delete-speed="45" data-pause="1100">
                        <span class="sparkle s1"><svg viewBox="0 0 24 24" fill="none">
                                <path d="M12 1 L14 9 L22 12 L14 15 L12 23 L10 15 L2 12 L10 9 Z" fill="currentColor"
                                    style="color:#ffe066" />
                            </svg></span>
                        <span class="sparkle s2"><svg viewBox="0 0 24 24" fill="none">
                                <path d="M12 1 L14 9 L22 12 L14 15 L12 23 L10 15 L2 12 L10 9 Z" fill="currentColor"
                                    style="color:#7bffb0" />
                            </svg></span>
                        <span class="gt-cursor">&nbsp;</span>
                    </span>
                </a>
            </div>

            <div class="signup-header">
                <h1>Create Account</h1>
                <p>Create your account to get started.</p>
            </div>

            <form id="signup-form">

                <div class="name-row">

                    <div class="form-group">
                        <label for="first-name">First name</label>
                        <input type="text" id="first-name" name="first_name" autocomplete="off" placeholder="First name"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="second-name">Second name</label>
                        <input type="text" id="second-name" name="second_name" autocomplete="off"
                            placeholder="Second name" required>
                    </div>

                </div>

                <div class="form-group">
                    <label for="username">Username</label>

                    <input type="text" id="username" name="username" autocomplete="username"
                        placeholder="Choose a username" autocomplete="off" minlength="3" maxlength="30"
                        pattern="[A-Za-z0-9_]+" required>

                    <small>
                        3–30 characters. Letters, numbers and _ only.
                    </small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-input">

                        <input type="password" id="password" name="password" autocomplete="new-password"
                            placeholder="Enter your password" minlength="8" required>

                        <button type="button" class="show-password" id="show-password">
                            Show
                        </button>

                    </div>

                    <small>At least 8 characters.</small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>

                    <div class="password-input">

                        <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password"
                            placeholder="Re-enter your password" minlength="8" required>

                        <button type="button" class="show-password" id="show-confirm-password">
                            Show
                        </button>

                    </div>

                </div>

                <div id="form-message">
                    <span id="message-text"></span>
                    <button id="message-close" type="button">×</button>
                </div>

                <button type="submit" class="signup-button">
                    Create account
                </button>

            </form>

            <div class="signin-link">
                <span>Already have an account?</span>
                <a href="/signin">Sign in</a>
            </div>

        </div>
    </section>


    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/runner.js') }}"></script>
    <script>
        const password = document.querySelector("#password");
        const confirmPassword = document.querySelector("#confirm-password");
        const messageBox = document.querySelector("#form-message");
        const messageText = document.querySelector("#message-text");
        const closeButton = document.querySelector("#message-close");
        const showPassword = document.querySelector("#show-password");
        const showConfirmPassword = document.querySelector("#show-confirm-password");

        window.addEventListener("pageshow", () => {
            form.reset();
        });

        function showMessage(message, type) {

            messageText.textContent = message;

            messageBox.className = type;

            setTimeout(() => {
                messageBox.className = "";
            }, 5000);

        }

        closeButton.addEventListener("click", () => {

            messageBox.className = "";

        });

        showPassword.addEventListener("click", () => {

            if (password.type === "password") {

                password.type = "text";
                showPassword.textContent = "Hide";

            } else {

                password.type = "password";
                showPassword.textContent = "Show";

            }

        });


        showConfirmPassword.addEventListener("click", () => {

            if (confirmPassword.type === "password") {

                confirmPassword.type = "text";
                showConfirmPassword.textContent = "Hide";

            } else {

                confirmPassword.type = "password";
                showConfirmPassword.textContent = "Show";

            }

        });

    </script>
</body>

</html>
