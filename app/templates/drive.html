<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/drive.css') }}">
  <title>Cloud Drive</title>
</head>

<body>

  <main class="app">

    <aside class="sidebar">

      <!-- MENU -->
      <nav class="menu">

        <button class="menu-item" id="menu-button">
          <span class="material-symbols-rounded">menu</span>
        </button>

        <button class="menu-item" data-page="home">
          <span class="material-symbols-rounded">home</span>
          <span class="label">Home</span>
        </button>

        <button class="menu-item" data-page="dashboard">
          <span class="material-symbols-rounded">dashboard</span>
          <span class="label">dashboard</span>
        </button>

        <button class="menu-item active" data-page="drive">
          <span class="material-symbols-rounded">files</span>
          <span class="label">Drive</span>
        </button>

        <button class="menu-item" data-page="favorite">
          <span class="material-symbols-rounded">favorite</span>
          <span class="label">Favorites</span>
        </button>

        <button class="menu-item" data-page="trash">
          <span class="material-symbols-rounded">delete</span>
          <span class="label">Trash</span>
        </button>

      </nav>


      <!-- BOTTOM MENU -->
      <div class="bottom-menu">

        <div class="message-container" id="message-container"></div>

        <div class="account-menu" id="account-menu">
          <button class="account-menu-item">
            <span class="material-symbols-rounded"> face </span>
            <span class="topbar-right" id="welcome"> Hi, User </span>
          </button>

          <button class="account-menu-item" id="logout-button">
            <span class="material-symbols-rounded"> logout </span> Logout </button>
        </div>

        <button class="menu-item" id="notifications-button">
          <span class="material-symbols-rounded"> notifications </span>
        </button>

        <button class="menu-item" id="theme-toggle" type="button" aria-label="Switch to dark theme">
          <span id="theme-icon" class="material-symbols-rounded"> dark_mode </span>
          <span class="label" id="theme-label">Dark mode</span>
        </button>

        <button class="menu-item" id="account-button">
          <span class="material-symbols-rounded"> account_circle </span>
          <span class="label">Account</span>
        </button>

        <button class="menu-item" data-page="settings">
          <span class="material-symbols-rounded">settings</span>
          <span class="label">Settings</span>
        </button>

      </div>

    </aside>

    <section class="mydrive">
      <div class="holder">
        <div class="path">
          <button class="back-button" id="back-button">
            <span class="material-symbols-rounded"> arrow_back </span>
            <span class="backbt-lable"> Back </span>
          </button>

          <span>|</span>

          <nav class="drive-path" id="breadcrumb">

          </nav>
        </div>

        <div class="search-container">
          <input type="search" id="search-input" placeholder="Search files and folders..." autocomplete="off" />

          <button id="search-button" aria-label="Search">
            <span class="material-symbols-rounded search-icon">
              search
            </span>
          </button>
        </div>

      </div>

      <div class="action-button">

        <button class="new-bt" id="add-button">
          <span class="material-symbols-rounded">add</span>
          <span class="addbt-lable">Add</span>
        </button>

        <div class="add-menu" id="add-menu">

          <button type="button" class="add-menu-item" id="New-folder-button">

            <span class="material-symbols-rounded">create_new_folder</span>
            New Folder

          </button>

          <button type="button" class="add-menu-item" id="upload-file-button">

            <span class="material-symbols-rounded">upload</span>
            Upload File

          </button>
          <input type="file" id="file-input" hidden>

        </div>

      </div>

      <div class="sorting">
        <h1> Folders & Files </h1>
      </div>

      <div class="content-area">

        <!-- FOLDERS -->
        <div class="folder-list" id="folder-list">



        </div>
        <!-- FILES -->
        <div class="file-list" id="file-list">



        </div>
        <!-- TEST CONTENT --> <!-- Remove this later -->

        <div id="freespace" style="height: 700px;"></div>
      </div>
    </section>

  </main>



  <!-- ========================= Create Popup ========================== -->

  <div class="modal-overlay" id="create-folder-modal">

    <div class="modal">

      <div class="modal-header">
        <h2 id="folder-modal-title">Create Folder</h2>

        <button type="button" id="close-folder-modal">
          ×
        </button>
      </div>

      <form id="create-folder-form">

        <div class="form-group">
          <label for="folder-name">Folder name</label>

          <input type="text" id="folder-name" name="folder_name" placeholder="Enter folder name" autocomplete="off"
            required>
        </div>

        <div class="modal-actions">

          <button type="button" id="cancel-folder-button">
            Cancel
          </button>

          <button type="submit" id="submit-folder-name">
            Create
          </button>

        </div>

      </form>

    </div>

  </div>

  <!-- ========================= Confirm Popup ========================== -->

  <div class="modal-overlay" id="delete-confirm-modal">

    <div class="modal">

      <div class="modal-header">

        <h2>Delete Folder</h2>

        <button type="button" id="close-delete-modal">
          ×
        </button>

      </div>

      <div class="delete-confirm-content">

        <p id="delete-confirm-message">
          Are you sure you want to delete this folder?
        </p>

        <p class="delete-warning">
          Everything inside this folder will also be deleted.
        </p>

      </div>

      <div class="modal-actions">

        <button type="button" id="cancel-delete-button">
          Cancel
        </button>

        <button type="button" id="confirm-delete-button">
          Delete
        </button>

      </div>

    </div>

  </div>

  <!-- ========================= FOLDER CONTEXT MENU ========================== -->

  <div id="folder-context-menu" class="context-menu">

    <button id="open-folder">
      <span class="material-symbols-rounded"> folder_open </span>
      Open
    </button>

    <button id="rename-folder">
      <span class="material-symbols-rounded"> drive_file_rename </span>
      Rename
    </button>

    <button id="copy-folder">
      <span class="material-symbols-rounded"> folder_copy </span>
      Copy
    </button>

    <button id="move-folder">
      <span class="material-symbols-rounded"> drive_file_move </span>
      Move
    </button>

    <div class="context-divider"></div>

    <button id="delete-folder">
      <span class="material-symbols-rounded"> delete </span>
      Delete
    </button>

  </div>

  <!-- ========================= FILE CONTEXT MENU ========================== -->

  <div id="file-context-menu" class="context-menu">

    <button id="download-file">
      <span class="material-symbols-rounded"> download </span>
      Download
    </button>

    <button id="rename-file">
      <span class="material-symbols-rounded"> drive_file_rename </span>
      Rename
    </button>

    <button id="copy-file">
      <span class="material-symbols-rounded"> file_copy </span>
      Copy
    </button>

    <button id="move-file">
      <span class="material-symbols-rounded"> drive_file_move </span>
      Move
    </button>

    <div class="context-divider"></div>

    <button id="delete-file">
      <span class="material-symbols-rounded"> delete </span>
      Delete
    </button>

  </div>

  <!-- ========================= COPY DIALOG ========================== -->

  <div id="copy-dialog" class="copy-dialog">

    <div class="copy-window">

      <!-- Header -->
      <div class="copy-header">

        <h2>Copy to</h2>

        <button type="button" id="close-copy-dialog" class="copy-close-button">
          ×
        </button>

      </div>


      <!-- Navigation -->
      <div class="copy-navigation">

        <button type="button" id="copy-back-button" class="copy-back-button">

          <span class="material-symbols-rounded">
            arrow_back
          </span>

        </button>


        <div id="copy-breadcrumb" class="copy-breadcrumb">

          <!-- JavaScript creates breadcrumb here -->

        </div>

      </div>


      <!-- Folder list -->
      <div id="copy-folder-list" class="copy-folder-list">

        <!-- JavaScript creates folders here -->

      </div>


      <!-- Bottom actions -->
      <div class="copy-actions">

        <button type="button" id="cancel-copy" class="copy-cancel-button">
          Cancel
        </button>

        <button type="button" id="confirm-copy" class="copy-confirm-button">
          Copy
        </button>

      </div>

    </div>

  </div>

  <!-- ========================= MOVE DIALOG ========================== -->

  <div id="move-dialog" class="move-dialog">

    <div class="move-window">

      <!-- Header -->
      <div class="move-header">

        <h2>Move to</h2>

        <button type="button" id="close-move-dialog" class="move-close-button">
          ×
        </button>

      </div>


      <!-- Navigation -->
      <div class="move-navigation">

        <button type="button" id="move-back-button" class="move-back-button">

          <span class="material-symbols-rounded">
            arrow_back
          </span>

        </button>


        <div id="move-breadcrumb" class="move-breadcrumb">

          <!-- JavaScript creates breadcrumb here -->

        </div>

      </div>


      <!-- Folder list -->
      <div id="move-folder-list" class="move-folder-list">

        <!-- JavaScript creates folders here -->

      </div>


      <!-- Actions -->
      <div class="move-actions">

        <button type="button" id="cancel-move" class="move-cancel-button">
          Cancel
        </button>

        <button type="button" id="confirm-move" class="move-confirm-button">
          Move Here
        </button>

      </div>

    </div>

  </div>


  <script src="{{ url_for('static', filename='js/code.js') }}"></script>
  <script>
    ////////////////////////////////////////////////////////////////////////////
    const app = document.querySelector(".app");
    const toggleButton = document.querySelector("#menu-button");

    const savedState = localStorage.getItem("sidebarCollapsed");

    if (savedState === "true") {
      app.classList.add("sidebar-collapsed");
    }

    toggleButton.addEventListener("click", () => {

      app.classList.toggle("sidebar-collapsed");

      const isCollapsed =
        app.classList.contains("sidebar-collapsed");

      localStorage.setItem("sidebarCollapsed", isCollapsed);
    });

    ////////////////////////////////////////////////////////////////////////////
    //add button menu
    const addButton = document.getElementById("add-button");

    const addMenu = document.getElementById("add-menu");

    /*
        Open / close New menu
    */
    addButton.addEventListener("click", (event) => {

      event.stopPropagation();

      addMenu.style.position = "";
      addMenu.style.left = "";
      addMenu.style.top = "";

      addMenu.classList.toggle("open");

    });

    /*
        Close menu when clicking outside
    */
    document.addEventListener("click", (event) => {

      if (!addMenu.contains(event.target) &&
        !addButton.contains(event.target)) {

        addMenu.classList.remove("open");

      }

    });

    ////////////////////////////////////////////////////////////////////////////

    // account menu open
    const accountButton = document.querySelector("#account-button");
    const accountMenu = document.querySelector("#account-menu");

    accountButton.addEventListener("click", () => {
      accountMenu.classList.toggle("open");
    });

    document.addEventListener("click", (event) => {

      if (!accountMenu.contains(event.target) &&
        !accountButton.contains(event.target)) {

        accountMenu.classList.remove("open");

      }

    });

    ////////////////////////////////////////////////////////////////////////////

    const messageContainer = document.querySelector("#message-container");

    function showMessage(message, type = "success") {
      const messageBox = document.createElement("div");
      messageBox.className = `form-message ${type}`;

      const messageText = document.createElement("span");
      messageText.className = "message-text";
      messageText.textContent = message;

      const closeButton = document.createElement("button");
      closeButton.className = "message-close";
      closeButton.type = "button";
      closeButton.textContent = "×";
      closeButton.setAttribute("aria-label", "Close notification");

      messageBox.append(messageText, closeButton);
      messageContainer.appendChild(messageBox);

      let messageTimer;

      function removeMessage() {
        clearTimeout(messageTimer);
        messageBox.remove();
      }

      closeButton.addEventListener("click", removeMessage);

      messageTimer = setTimeout(removeMessage, 5000);
    }

    ////////////////////////////////////////////////////////////////////////////

    //popup menu 
    const closeFolderModal =
      document.querySelector("#close-folder-modal");

    const cancelFolderButton =
      document.querySelector("#cancel-folder-button");

    const createFolderForm =
      document.querySelector("#create-folder-form");

    const folderNameInput =
      document.querySelector("#folder-name");

    // Close popup
    closeFolderModal.addEventListener("click", () => {

      createFolderModal.classList.remove("open");

    });

    // Cancel
    cancelFolderButton.addEventListener("click", () => {

      createFolderModal.classList.remove("open");

    });

    // Close when clicking outside popup
    createFolderModal.addEventListener("click", (event) => {

      if (event.target === createFolderModal) {

        createFolderModal.classList.remove("open");

      }

    });

    ////////////////////////////////////////////////////////////////////////////

    const closeCopyDialog =
      document.getElementById("close-copy-dialog");

    if (closeCopyDialog) {
      closeCopyDialog.addEventListener("click", () => {
        document.getElementById("copy-dialog").style.display = "none";
      });
    }

    const closeMoveDialog =
      document.getElementById("close-move-dialog");

    if (closeMoveDialog) {
      closeMoveDialog.addEventListener("click", () => {
        document.getElementById("move-dialog").style.display = "none";
      });
    }

    ////////////////////////////////////////////////////////////////////////////

    const themeToggle = document.querySelector("#theme-toggle");
    const themeIcon = document.querySelector("#theme-icon");
    const themeLabel = document.querySelector("#theme-label");

    // Read the saved theme, or use light mode by default.
    let currentTheme = localStorage.getItem("theme") || "light";

    // Apply the selected theme.
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);

      currentTheme = theme;

      // Update the button to show the opposite action.
      if (theme === "dark") {
        themeIcon.textContent = "light_mode";
        themeLabel.textContent = "Light mode";
        themeToggle.setAttribute("aria-label", "Switch to light theme");
      } else {
        themeIcon.textContent = "dark_mode";
        themeLabel.textContent = "Dark mode";
        themeToggle.setAttribute("aria-label", "Switch to dark theme");
      }

      // Remember the selection.
      localStorage.setItem("theme", theme);
    }

    // Apply the saved theme when the page loads.
    applyTheme(currentTheme);

    // Toggle between light and dark when clicked.
    themeToggle.addEventListener("click", () => {
      const newTheme = currentTheme === "light" ? "dark" : "light";

      applyTheme(newTheme);
    });


  </script>
</body>

</html>
